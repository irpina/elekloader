# The macOS app, built for a release: elekloader.app with the core mods built
# in, universal2 (Apple silicon and Intel), signed with a Developer ID
# certificate, notarized by Apple and stapled, in elekloader-<version>-macos.dmg,
# attached to that release with its checksum in SHA256SUMS.txt.
#
# Run it by hand (Actions > macos-build > Run workflow) with the release's
# tag, like windows-build: once the release exists and carries its
# core-*.elemod files. No firmware ever reaches this workflow.
#
# Secrets (Settings > Secrets and variables > Actions):
#   MACOS_CERTIFICATE           the Developer ID Application certificate and its
#                               private key, exported as a .p12, base64-encoded
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   NOTARY_KEY                  an App Store Connect API key (the AuthKey_<id>.p8
#                               file's text), for notarytool
#   NOTARY_KEY_ID               that key's ID
#   NOTARY_ISSUER               the Issuer ID shown above the key in App Store Connect
name: macos-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (vX.Y.Z); the tag must exist and equal v + elekloader's version"
        required: true

permissions:
  contents: write

# windows-build is in the same group: both rewrite the release's SHA256SUMS.txt
concurrency:
  group: release-${{ inputs.tag }}

jobs:
  macos-build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # python.org's build: universal2, with its own Tk
      - name: The tag is the version
        run: |
          v=$(python -c "import elekloader; print(elekloader.__version__)")
          test "$TAG" = "v$v" || { echo "tag $TAG is not v$v"; exit 1; }
      - name: Unit tests
        run: python tests/test_units.py
      - name: Build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: The core mods, from the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "core-*.elemod" --dir build/core
      - name: The signing certificate, in a keychain of its own
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$P12" || { echo "the MACOS_CERTIFICATE secret is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$pass" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$pass" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$KEYCHAIN" > /dev/null
          # first in the search list, so codesign finds the identity
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Developer ID Application: / { print $2; exit }')
          test -n "$id" || { echo "MACOS_CERTIFICATE holds no Developer ID Application identity"; exit 1; }
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Build, sign, self-test and notarize
        env:
          NOTARY_KEY_TEXT: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          printf '%s\n' "$NOTARY_KEY_TEXT" > "$NOTARY_KEY"
          python packaging/build_macos.py --core build/core/core-*.elemod \
            --identity "$SIGN_IDENTITY" --notarize --out dist
      - name: Attach to the release
        run: |
          # SHA256SUMS.txt lists every app on the release: keep the other builds' lines
          old=/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS.txt; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir build/release
            old=build/release/SHA256SUMS.txt
          fi
          awk 'NR == FNR { ours[$2]; print; next } !($2 in ours)' dist/SHA256SUMS.txt "$old" | sort -k 2 > build/SHA256SUMS.txt
          mv build/SHA256SUMS.txt dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          gh release upload "$TAG" dist/elekloader-*-macos.dmg dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
