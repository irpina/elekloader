# The Windows app, built for a release: elekloader.exe with the core mods
# built in, attached to that release as elekloader-<version>-windows.exe with
# its checksum in SHA256SUMS.txt (macos-build adds the macOS app's).
#
# Run it by hand (Actions > windows-build > Run workflow) with the release's
# tag, once the release exists and carries its core-*.elemod files, one per
# device with linkable mods (mods/core, mods/core-dn1). They are built with
# the SDK, which needs each stock OS file, so they are made where those files
# are and attached to the release first; no firmware ever reaches this
# workflow.
name: windows-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (vX.Y.Z); the tag must exist and equal v + elekloader's version"
        required: true

permissions:
  contents: write

# macos-build is in the same group: both rewrite the release's SHA256SUMS.txt
concurrency:
  group: release-${{ inputs.tag }}

jobs:
  windows-build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the version
        run: |
          v=$(python -c "import elekloader; print(elekloader.__version__)")
          test "$TAG" = "v$v" || { echo "tag $TAG is not v$v"; exit 1; }
      - name: Unit tests
        run: python tests/test_units.py
      - name: Build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: The core mods, from the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "core-*.elemod" --dir build/core
      - name: Build and self-test
        run: python packaging/build_windows.py --core build/core/core-*.elemod --out dist
      - name: Attach to the release
        run: |
          # SHA256SUMS.txt lists every app on the release: keep the other builds' lines
          old=/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS.txt; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir build/release
            old=build/release/SHA256SUMS.txt
          fi
          awk 'NR == FNR { ours[$2]; print; next } !($2 in ours)' dist/SHA256SUMS.txt "$old" | sort -k 2 > build/SHA256SUMS.txt
          mv build/SHA256SUMS.txt dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          gh release upload "$TAG" dist/elekloader-*-windows.exe dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
